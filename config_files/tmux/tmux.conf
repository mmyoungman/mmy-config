# This dir is linked to ~/.config/tmux, which tmux has only read since 3.1 --
# an older tmux ignores it silently and comes up with stock bindings. Every
# target here is well past that; a box that isn't wants ~/.tmux.conf instead.

# C-b is a reach for the same hand that holds ctrl. C-a is where screen put it,
# so it is also what the muscle memory expects.
set -g prefix C-a
unbind C-b
# Doubling the prefix sends a literal C-a on: to an inner tmux over ssh, and to
# readline, where it is still beginning-of-line under emacs mode.
bind C-a send-prefix

# The config is a symlink into the repo, so an edit in the checkout is already
# live at this path -- reloading is the whole gap between editing and using it.
# This takes r from refresh-client, whose redraw is rarely worth a keystroke.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Already vi in practice: tmux picks vi when VISUAL or EDITOR contains "vi",
# and .bashrc exports EDITOR=nvim. Set anyway because that check reads the
# environment of whatever started the *server* -- start one from somewhere
# .bashrc never ran, and copy mode silently comes up emacs.
setw -g mode-keys vi
