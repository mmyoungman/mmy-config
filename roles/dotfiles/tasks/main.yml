---
# Expects home, config_files_dir, config_links and gitemail from the calling
# playbook. Each playbook passes its own config_links: the workstation links
# .xprofile/.ideavimrc/VS Code as well, the server only wants the headless set.
#
# config_files_dir must be a path on the *target*, not the controller --
# these are symlinks, so a controller path would dangle on a pushed run.
#
# An item may carry its own `dir` to be linked from somewhere other than
# config_files_dir. Nothing here uses it, but the homelab repo does: its
# server-only scripts live in that repo rather than this one, so a single run
# has to link from two directories. Without this the alternative was calling
# the role twice, which would also re-template ~/.gitconfig and pay for the
# headless nvim run a second time.

# First, before anything below has moved a file or made a link. `file:
# state=link` with force: yes will cheerfully point a link at a path that does
# not exist, and ansible calls that a success -- so a target whose checkout is
# behind, or whose submodule was never initialised, ends up with a tree of
# dangling links and a green run. Nothing notices until something tries to use
# one, and what that looks like depends entirely on the consumer: a missing
# .bashrc is obvious at the next login, but a link exec'd by a service just
# returns 127 to something that is not watching.
- name: Check every link source exists before linking to it
  stat:
    path: "{{ (item.dir | default(config_files_dir)) + '/' + item.src }}"
  loop: "{{ config_links }}"
  loop_control:
    label: "{{ item.src }}"
  register: link_sources

# config_files_dir and any per-item `dir` are paths on the *target*, so this
# reports on the target's checkout rather than the controller's. Both causes in
# the message are things a pushed run is meant to have handled before reaching
# this role, which is why naming them is worth the line.
- name: Fail rather than leave a dangling symlink
  assert:
    that: link_sources.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing on the target, so these links would dangle:
      {{ link_sources.results | rejectattr('stat.exists')
         | map(attribute='item.src') | list | join(', ') }}.
      The checkout is behind, or a submodule was never initialised.
    success_msg: "All {{ config_links | length }} link sources present."

- name: Make sure each link's parent dir exists
  file:
    path: "{{ (home + '/' + item.dest) | dirname }}"
    state: directory
  loop: "{{ config_links }}"
  loop_control:
    label: "{{ (home + '/' + item.dest) | dirname }}"

# --backup=numbered so a second backup on the same date bumps the older
# one to .~1~ rather than clobbering it. The 'is not link' check below
# is what makes this idempotent: after the first run every dest is a
# symlink, so this only fires again if something replaces one with a
# real file.
#
# Not named 'target': server.yml takes the host to run against as
# `-e target=<host>`, and extra vars outrank task vars, so the path here would
# resolve to the hostname. Every 'is exists' would then be false, the backup
# would silently skip, and the link task below would force: yes over a real
# file with nothing kept.
- name: Back up config that isn't already a symlink
  command:
    cmd: mv --backup=numbered -- "{{ link_path }}" "{{ link_path }}.{{ ansible_facts.date_time.date }}"
  vars:
    link_path: "{{ home }}/{{ item.dest }}"
  when:
    - link_path is exists
    - link_path is not link
  loop: "{{ config_links }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Symlink config into place
  file:
    src: "{{ item.dir | default(config_files_dir) }}/{{ item.src }}"
    dest: "{{ home }}/{{ item.dest }}"
    state: link
    force: yes
  loop: "{{ config_links }}"
  loop_control:
    label: "{{ item.dest }}"

# Older installs symlinked this into the repo; the template below would
# write the real email address through the link and into git.
- name: Drop ~/.gitconfig if it's a symlink
  file:
    path: "{{ home }}/.gitconfig"
    state: absent
  when: (home + '/.gitconfig') is link

- name: Copy gitconfig template
  template:
    src: gitconfig.j2
    dest: "{{ home }}/.gitconfig"
    backup: yes

# Pre-install plugins via nvim's built-in plugin manager (:help vim.pack).
# vim.pack.add() installs anything missing on the first run; the revisions
# come from config_files/nvim/nvim-pack-lock.json. Plugins are updated
# separately with :lua vim.pack.update().
#
# The PATH override is not redundant with .bashrc: that file returns early for
# non-interactive shells, which is exactly what Ansible gets, so its path_add
# lines never run here. Without this a bare `nvim` finds Debian's stale
# /usr/bin/nvim, init.lua bails on the 0.12 check, and no plugins install.
- name: Pre-install nvim plugins
  command: nvim --headless -c quitall
  environment:
    PATH: "{{ home }}/.local/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false
