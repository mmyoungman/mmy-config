---
# Cache only, deliberately no upgrade: unlike pacman's -Sy, a bare `apt update`
# followed by installs is safe on Debian, so there is no partial-upgrade hazard
# to avoid here -- and this role targets a work machine where an unattended
# upgrade would be an unwelcome surprise. The Arch role does a full -Syu.
- name: Update package cache
  changed_when: false
  apt:
    update_cache: yes

- name: Install XFCE stuff
  apt:
    name:
      - xfce4-whiskermenu-plugin
      - xfce4-screenshooter
      - xfce4-clipman-plugin

- name: Install general apps
  apt:
    name:
      - ansible
      - git

      # general apps
      # TODO: Add google-chrome-stable from PPA?
      #- firefox # not for work!
      #- torbrowser-launcher  # This may need to be installed via another method
      - gimp
      - vlc
      - audacious
      - deluge
      - galculator
      #- signal-desktop
      - libreoffice

- name: Install utils
  apt:
    name:
      - catfish       # file search
      - p7zip-full    # 7zip
      - ffmpeg
      - ripgrep
      - fzf           # fuzzy finder, required by nvim's fzf-lua
      - fd-find       # ships the binary as fdfind, which fzf-lua looks for
      - entr
      #- zbar
      - xclip
      - jq
      - htop
      - curl
      - viewnior

- name: Install programming tools
  apt:
    name:
      - cmake
      - gcc
      - clang
      - gdb
      - golang
      #- dotnet-sdk
      #- python3
      #- python3-pip
      #- nodejs
      #- npm
      #- sqlite3
      - sqlitebrowser
      #- docker.io
      #- docker-compose

- name: Install IDEs
  apt:
    name:
      - neovim
      #- code # not in debian repos
      - qtcreator

# Google Chrome, Etcher
