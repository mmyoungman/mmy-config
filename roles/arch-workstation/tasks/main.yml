---
# update_cache without upgrade would be a bare `pacman -Sy`, so the installs
# below would pull new packages onto an un-upgraded system. Both together are
# the `pacman -Syu` the task name promises.
- name: Update all packages
  pacman:
    update_cache: yes
    upgrade: yes
- name: Install XFCE stuff
  pacman:
    name:
      - xfce4-whiskermenu-plugin
      - xfce4-screenshooter
      - xfce4-clipman-plugin

- name: Install general apps
  pacman:
    name:
      - ansible
      - git

      # general apps
      - firefox
      - torbrowser-launcher
      - gimp
      - vlc
      - audacious
      - deluge-gtk
      - galculator
      - signal-desktop
      - libreoffice-fresh

- name: Install utils
  pacman:
    name:
      - catfish # file search
      - 7zip
      - ffmpeg
      - ripgrep
      - fzf # fuzzy finder, required by nvim's fzf-lua
      - fd
      - entr
      - zbar
      - xclip
      - jq
      - htop
      - curl
      - viewnior
      - tmux

- name: Install programming stuff
  pacman:
    name:
      - cmake
      - gcc
      - clang
      - gdb

      - go

      # No dotnet-sdk: the SDK is installed into ~/.dotnet by workstation.yml,
      # which explains why. A distro one on PATH would shadow that tree.

      - python

      - nodejs
      - npm

      - sqlite
      - sqlitebrowser

      - docker
      - docker-compose

# Not merely absent from the list above: an already-installed distro dotnet has
# to go, because it does not sit quietly beside the ~/.dotnet tree that
# workstation.yml unpacks -- it shadows it. The muxer finds SDKs relative to the
# binary you invoke, so whichever dotnet PATH resolves first decides which SDKs
# exist at all, and the distro's will never carry every feature band a repo's
# global.json might pin.
#
# Only the six explicitly-installed packages are named. --recursive takes the
# runtimes and targeting packs they pull in, but pacman will not drop a package
# someone installed by hand as though it were a dependency, so the two that are
# both (dotnet-host, dotnet-runtime) have to be listed as well.
#
# This is enforced on every run, so installing a distro dotnet by hand later
# will not survive the next play. That is the intent -- a second SDK tree is
# exactly the failure this is here to prevent -- but it means an extra SDK
# version belongs in workstation.yml's list, not in pacman.
- name: Remove the distro .NET, which the ~/.dotnet install replaces
  pacman:
    name:
      - aspnet-runtime
      - dotnet-host
      - dotnet-runtime
      - dotnet-sdk
      - dotnet-sdk-6.0
      - dotnet-sdk-8.0
    state: absent
    extra_args: --recursive

- name: Install IDEs
  pacman:
    name:
      - neovim
      - neovim-qt
      - code
      - qtcreator

- name: Install security tools
  pacman:
    name:
      - fwupd
      - arch-audit

# config_files/.xprofile swaps these with setxkbmap, which is an X client and so
# does nothing on a virtual console -- dropping to a TTY to debug a broken X
# session left caps as caps. The console is a separate mechanism entirely:
# systemd-vconsole-setup runs `loadkeys $KEYMAP` from /etc/vconsole.conf, and
# stock uk leaves caps as caps. Arch has no console-setup, so unlike Debian
# there is no XKBOPTIONS to set -- the swap has to be a keymap of its own.
#
# It cannot live in config_files/ with the dotfiles: loadkeys resolves a bare
# name only under /usr/share/kbd/keymaps. Not /usr/local either -- some distros
# patch that path in, Arch's build does not.
#
# Next to uk.map.gz rather than at the top of the keymaps tree because every
# name that is known to resolve lives in a subdirectory like this one. pacman
# leaves unowned files alone, so a kbd upgrade will not clear it out.
- name: Install a console keymap with caps and escape swapped
  copy:
    dest: /usr/share/kbd/keymaps/i386/qwerty/uk-swapescape.map
    # The include needs an absolute path. A bare `include "uk"` does not
    # resolve -- includes are searched only under keymaps/*/include/, never
    # next to the including file or across the rest of the tree.
    content: |
      include "/usr/share/kbd/keymaps/i386/qwerty/uk.map.gz"
      keycode 58 = Escape
      keycode  1 = Caps_Lock
    mode: "0644"
  notify: reload console keymap

- name: Use that keymap on the virtual consoles
  lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: KEYMAP=uk-swapescape
  notify: reload console keymap

