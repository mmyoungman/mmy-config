---

- hosts: localhost
  vars:
    gitemail: "mark@[domain]" # avoid bot scraping via a template
    home: "{{ lookup('env', 'HOME') }}"
    config_files_dir: "{{ playbook_dir }}/config_files"
    # Each link is only created when its parent dir already exists, so config
    # for an editor that isn't installed on this machine is skipped.
    config_links:
      - { src: .bashrc, dest: .bashrc }
      - { src: .inputrc, dest: .inputrc }
      - { src: .xprofile, dest: .xprofile }
      - { src: .ideavimrc, dest: .ideavimrc }
      - { src: nvim, dest: .config/nvim }
      - { src: vscode-settings.json, dest: .config/Code/User/settings.json }
      - { src: vscode-settings.json, dest: .config/Code - OSS/User/settings.json }
  become: yes
  tasks:
    - name: If arch, do this
      include_role:
        name: arch-workstation
      when: ansible_os_family == "Archlinux"

    - name: If ubuntu, do this
      include_role:
        name: ubuntu-workstation
      when: ansible_os_family == "Debian"

    - name: Set bash/nvim/vscode/idea config
      become: no
      block:
        - name: Make sure ~/.config exists
          file:
            path: "{{ home }}/.config"
            state: directory

        # --backup=numbered so a second backup on the same date bumps the older
        # one to .~1~ rather than clobbering it. The 'is not link' check below
        # is what makes this idempotent: after the first run every target is a
        # symlink, so this only fires again if something replaces one with a
        # real file.
        - name: Back up config that isn't already a symlink
          command:
            cmd: mv --backup=numbered -- "{{ target }}" "{{ target }}.{{ ansible_facts.date_time.date }}"
          vars:
            target: "{{ home }}/{{ item.dest }}"
          when:
            - target | dirname is directory
            - target is exists
            - target is not link
          loop: "{{ config_links }}"
          loop_control:
            label: "{{ item.dest }}"

        - name: Symlink config into place
          file:
            src: "{{ config_files_dir }}/{{ item.src }}"
            dest: "{{ target }}"
            state: link
            force: yes
          vars:
            target: "{{ home }}/{{ item.dest }}"
          when: target | dirname is directory
          loop: "{{ config_links }}"
          loop_control:
            label: "{{ item.dest }}"

        # Older installs symlinked this into the repo; the template below would
        # write the real email address through the link and into git.
        - name: Drop ~/.gitconfig if it's a symlink
          file:
            path: "{{ home }}/.gitconfig"
            state: absent
          when: (home + '/.gitconfig') is link

        - name: Copy gitconfig template
          template:
            src: config_files/gitconfig.j2
            dest: "{{ home }}/.gitconfig"
            backup: yes

        # Pre-install plugins via nvim's built-in plugin manager (:help vim.pack).
        # vim.pack.add() installs anything missing on the first run; the revisions
        # come from config_files/nvim/nvim-pack-lock.json. Plugins are updated
        # separately with :lua vim.pack.update().
        - name: Pre-install nvim plugins
          command: nvim --headless -c quitall
          changed_when: false
    # check_mode: no because a command task skipped under --check registers
    # rc 0, which would make the guard below pass on a non-XFCE machine. This
    # only reads a version string, so it's safe to run either way.
    - name: Check whether this is an XFCE machine
      become: no
      command: xfconf-query --version
      register: xfconf_query
      changed_when: false
      failed_when: false
      check_mode: no
      tags: [xfce]

    # Copied rather than symlinked: xfconfd buffers changes in memory and
    # flushes on exit by renaming a temp file over the target, which would
    # replace the symlink with a real file and orphan the repo copy. New
    # bindings show up after logging out and back in.
    - name: Restore XFCE keyboard shortcuts
      become: no
      when: xfconf_query.rc | default(1) == 0
      tags: [xfce]
      block:
        - name: Stop xfconfd so it can't flush stale settings over the new file
          command: pkill -x xfconfd
          register: pkill_xfconfd
          changed_when: false
          # rc 1 just means it wasn't running.
          failed_when: pkill_xfconfd.rc not in [0, 1]

        - name: Copy keyboard shortcuts into place
          copy:
            src: config_files/xfce4/xfce4-keyboard-shortcuts.xml
            dest: "{{ home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml"
            backup: yes
