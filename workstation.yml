---

- hosts: localhost
  vars:
    gitemail: "mark@[domain]" # avoid bot scraping via a template
    home: "{{ ansible_env.HOME }}"
    # Safe as a controller path because this playbook only ever targets
    # localhost. server.yml has to point at a checkout on the target instead.
    config_files_dir: "{{ playbook_dir }}/config_files"
    # Every parent dir below is created if missing, so all of these are linked
    # unconditionally. The VS Code dirs in particular only appear when the
    # editor is first *launched*, not when it is installed -- gating on them
    # meant a fresh machine got VS Code from the role and silently no settings.
    # The cost is an empty ~/.config/Code/User on a machine with no VS Code.
    config_links:
      - { src: .bashrc, dest: .bashrc }
      - { src: .inputrc, dest: .inputrc }
      - { src: .xprofile, dest: .xprofile }
      - { src: .ideavimrc, dest: .ideavimrc }
      - { src: nvim, dest: .config/nvim }
      - { src: vscode-settings.json, dest: .config/Code/User/settings.json }
      - { src: vscode-settings.json, dest: .config/Code - OSS/User/settings.json }
  tasks:
    - name: If arch, do this
      include_role:
        name: arch-workstation
        apply:
          become: yes
      when: ansible_facts['os_family'] == "Archlinux"

    - name: If ubuntu, do this
      include_role:
        name: ubuntu-workstation
        apply:
          become: yes
      when: ansible_facts['os_family'] == "Debian"

    # CachyOS ships fish as the login shell, but the config below (.bashrc,
    # .inputrc) assumes bash. Changing your own shell still needs root, hence
    # become. Takes effect on the next login, not in the current session.
    - name: Use bash as the login shell
      become: yes
      user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /bin/bash

    - name: Set bash/nvim/vscode/idea config
      include_role:
        name: dotfiles

    # check_mode: no because a command task skipped under --check registers
    # rc 0, which would make the guard below pass on a non-XFCE machine. This
    # only reads a version string, so it's safe to run either way.
    - name: Check whether this is an XFCE machine
      command: xfconf-query --version
      register: xfconf_query
      changed_when: false
      failed_when: false
      check_mode: no
      tags: [xfce]

    # Copied rather than symlinked: xfconfd buffers changes in memory and
    # flushes on exit by renaming a temp file over the target, which would
    # replace the symlink with a real file and orphan the repo copy. New
    # bindings show up after logging out and back in.
    - name: Restore XFCE keyboard shortcuts
      when: xfconf_query.rc | default(1) == 0
      tags: [xfce]
      block:
        - name: Make sure the xfconf channel dir exists
          file:
            path: "{{ home }}/.config/xfce4/xfconf/xfce-perchannel-xml"
            state: directory

        # Probe first so a re-run that changes nothing leaves xfconfd alone.
        # Killing it discards whatever the current desktop session has buffered
        # but not yet flushed, which is a bad trade for a no-op copy.
        - name: Check whether the shortcuts file needs replacing
          copy: &shortcuts
            src: config_files/xfce4/xfce4-keyboard-shortcuts.xml
            dest: "{{ home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml"
            backup: yes
          check_mode: yes
          register: shortcuts

        - name: Stop xfconfd so it can't flush stale settings over the new file
          command: pkill -x xfconfd
          register: pkill_xfconfd
          changed_when: false
          # rc 1 just means it wasn't running.
          failed_when: pkill_xfconfd.rc not in [0, 1]
          when: shortcuts.changed

        - name: Copy keyboard shortcuts into place
          copy: *shortcuts
          when: shortcuts.changed
