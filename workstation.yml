---

- hosts: localhost
  vars:
    gitemail: "mark@[domain]" # avoid bot scraping via a template
    home: "{{ ansible_facts['env']['HOME'] }}"
    # Safe as a controller path because this playbook only ever targets
    # localhost. A playbook that pushed to another machine could not use one --
    # these are symlinks, so a controller path would dangle on the target.
    config_files_dir: "{{ playbook_dir }}/config_files"
    # Every parent dir below is created if missing, so all of these are linked
    # unconditionally. The VS Code dirs in particular only appear when the
    # editor is first *launched*, not when it is installed -- gating on them
    # meant a fresh machine got VS Code from the role and silently no settings.
    # The cost is an empty ~/.config/Code/User on a machine with no VS Code.
    config_links:
      - { src: .bashrc, dest: .bashrc }
      - { src: .inputrc, dest: .inputrc }
      - { src: .xprofile, dest: .xprofile }
      - { src: .ideavimrc, dest: .ideavimrc }
      - { src: nvim, dest: .config/nvim }
      - { src: tmux, dest: .config/tmux }
      - { src: vscode-settings.json, dest: .config/Code/User/settings.json }
      - { src: vscode-settings.json, dest: .config/Code - OSS/User/settings.json }
  tasks:
    - name: If arch, do this
      include_role:
        name: arch-workstation
        apply:
          become: yes
      when: ansible_facts['os_family'] == "Archlinux"

    - name: If ubuntu, do this
      include_role:
        name: ubuntu-workstation
        apply:
          become: yes
      when: ansible_facts['os_family'] == "Debian"

    # Here rather than in the per-OS roles for the usual reason -- it is
    # identical on both -- but also because it is the one piece of software
    # that installs into $HOME rather than system-wide, so it wants the
    # `become: no` the roles cannot give it.
    #
    # The distro packages (pacman dotnet-sdk, apt dotnet-sdk) are deliberately
    # not used. A .NET repo pins its SDK in global.json and the resolver only
    # rolls *forward*, so a box carrying 10.0.111 cannot build a repo asking
    # for 10.0.302 -- and no distro carries every feature band a repo might
    # name. Worse, the muxer looks for SDKs relative to the binary you invoke
    # rather than under DOTNET_ROOT, so a distro dotnet earlier on PATH hides
    # this tree completely however that variable is set. config_files/.bashrc
    # prepends ~/.dotnet for that reason, which in turn means the versions
    # here are the only ones anything will find: add each one this machine
    # needs below rather than expecting a fallback to the distro's.
    #
    # Unpacked directly rather than run through dotnet-install.sh. That script
    # is fetched over the wire and changes a dozen times a year, so pinning its
    # hash would mean a re-audit every few weeks and an unpinned one is an
    # unreviewed script run as this user -- neither is worth it for what it
    # does here, which is pick a URL and untar it. Microsoft publishes a
    # .sha512 beside each tarball, so pin that instead: it only changes when
    # the version below is deliberately bumped.
    #
    # linux-x64 is hardcoded because both machines are; supporting arm would
    # mean a x86_64 -> x64 translation table for no user that exists.
    - name: Install the .NET SDK
      become: no
      vars:
        dotnet_version: "10.0.302"
        # Published at the tarball URL below with `.sha512` appended.
        dotnet_sha512: "10069bec8783596484a610332f090d562802a41b9b40e3327a5a5688b572e10c296ae300f940d40461f23c157ed1b0843c2f8e6b3f20d8d8d9d83432d8143bac"
        dotnet_tarball: "/tmp/dotnet-sdk-{{ dotnet_version }}-linux-x64.tar.gz"
      block:
        # unarchive has no checksum option, so the download is a task of its
        # own and the guard cannot be `creates:` on the unpack. Checking first
        # also keeps a re-run from re-fetching 235MB it would then discard.
        - name: Check whether the .NET SDK is already installed
          stat:
            path: "{{ home }}/.dotnet/sdk/{{ dotnet_version }}"
          register: dotnet_sdk

        - name: Install the SDK if it is missing
          when: not dotnet_sdk.stat.exists
          block:
            # unarchive does not create its destination.
            - name: Make sure the SDK root exists
              file:
                path: "{{ home }}/.dotnet"
                state: directory
                mode: "0755"

            # A checksum mismatch fails the task, so nothing is unpacked.
            - name: Download the SDK tarball
              get_url:
                url: "https://builds.dotnet.microsoft.com/dotnet/Sdk/{{ dotnet_version }}/dotnet-sdk-{{ dotnet_version }}-linux-x64.tar.gz"
                dest: "{{ dotnet_tarball }}"
                checksum: "sha512:{{ dotnet_sha512 }}"
                mode: "0644"

            # The tarball lays down sdk/<version> and shared/ alongside
            # whatever is already there, so adding a second version joins the
            # first rather than replacing it.
            - name: Unpack it into ~/.dotnet
              unarchive:
                src: "{{ dotnet_tarball }}"
                remote_src: yes
                dest: "{{ home }}/.dotnet"
          always:
            # 235MB, and the installed tree is the thing worth keeping. In
            # `always` so a failed unpack does not leave it behind either.
            - name: Remove the downloaded tarball
              file:
                path: "{{ dotnet_tarball }}"
                state: absent

    # Lives here rather than in the per-OS roles because these are kernel
    # settings and identical on both families -- splitting it would mean
    # maintaining the same list twice.
    #
    # Deliberately narrow. Two knobs the hardening guides push, and why they
    # are not here:
    #   kernel.unprivileged_userns_clone=0 breaks bubblewrap, Flatpak and
    #     Chrome's sandbox. It removes more isolation than it adds.
    #   net.*.send_redirects=0 only matters on a machine that forwards
    #     packets. Neither of these is a router.
    - name: Harden kernel settings
      become: yes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-hardening.conf
        sysctl_set: yes
        reload: yes
      loop:
        # Kernel pointers exposed through /proc leak KASLR offsets, handing an
        # exploit addresses it would otherwise have to guess. 1 hides them from
        # unprivileged users, 2 from everyone. The default is 0.
        - { name: kernel.kptr_restrict, value: "2" }
        # A laptop joins untrusted networks, where an ICMP redirect is a way to
        # be nudged onto someone else's next hop. 'all' and 'default' are both
        # needed: 'all' covers the interfaces that exist now, 'default' covers
        # any brought up later.
        - { name: net.ipv4.conf.all.accept_redirects, value: "0" }
        - { name: net.ipv4.conf.default.accept_redirects, value: "0" }
        - { name: net.ipv6.conf.all.accept_redirects, value: "0" }
        - { name: net.ipv6.conf.default.accept_redirects, value: "0" }

    # CachyOS ships fish as the login shell, but the config below (.bashrc,
    # .inputrc) assumes bash. Changing your own shell still needs root, hence
    # become. Takes effect on the next login, not in the current session.
    - name: Use bash as the login shell
      become: yes
      user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /bin/bash

    - name: Set bash/nvim/vscode/idea config
      include_role:
        name: dotfiles

    # check_mode: no because a command task skipped under --check registers
    # rc 0, which would make the guard below pass on a non-XFCE machine. This
    # only reads a version string, so it's safe to run either way.
    - name: Check whether this is an XFCE machine
      command: xfconf-query --version
      register: xfconf_query
      changed_when: false
      failed_when: false
      check_mode: no
      tags: [xfce]

    # Copied rather than symlinked: xfconfd buffers changes in memory and
    # flushes on exit by renaming a temp file over the target, which would
    # replace the symlink with a real file and orphan the repo copy. New
    # bindings show up after logging out and back in.
    - name: Restore XFCE keyboard shortcuts
      when: xfconf_query.rc | default(1) == 0
      tags: [xfce]
      block:
        - name: Make sure the xfconf channel dir exists
          file:
            path: "{{ home }}/.config/xfce4/xfconf/xfce-perchannel-xml"
            state: directory

        # Probe first so a re-run that changes nothing leaves xfconfd alone.
        # Killing it discards whatever the current desktop session has buffered
        # but not yet flushed, which is a bad trade for a no-op copy.
        - name: Check whether the shortcuts file needs replacing
          copy: &shortcuts
            src: config_files/xfce4/xfce4-keyboard-shortcuts.xml
            dest: "{{ home }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-keyboard-shortcuts.xml"
            backup: yes
          check_mode: yes
          register: shortcuts

        - name: Stop xfconfd so it can't flush stale settings over the new file
          command: pkill -x xfconfd
          register: pkill_xfconfd
          changed_when: false
          # rc 1 just means it wasn't running.
          failed_when: pkill_xfconfd.rc not in [0, 1]
          when: shortcuts.changed

        - name: Copy keyboard shortcuts into place
          copy: *shortcuts
          when: shortcuts.changed
